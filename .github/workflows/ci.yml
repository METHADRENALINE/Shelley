name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shelley_test
          POSTGRES_USER: shelley
          POSTGRES_PASSWORD: shelley
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelley -d shelley_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHELLEY_TEST_DATABASE_URL: postgresql://shelley:shelley@127.0.0.1:5432/shelley_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy shelley

      - name: Compile
        run: python -m compileall -q bot.py shelley tests

      - name: Secret scan
        run: python -m pytest -q tests/test_repo.py::test_public_files_do_not_contain_private_data tests/test_repo.py::test_runtime_private_files_are_not_committed

      - name: Tests
        run: python -m pytest -q

      - name: Docker build
        run: docker build .
